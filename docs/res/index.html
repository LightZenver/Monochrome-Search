<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Monochrome Search</title>
<style>
:root{box-sizing:border-box}
body.inc{}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#050505;color:#f2f2f2;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#050505}
canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:0}
.vig{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 40%,transparent 20%,#000 100%);opacity:.7;pointer-events:none;z-index:0}
#top{position:relative;z-index:3;padding:10px 12px;display:none;gap:8px;align-items:center;border-bottom:1px solid #2a2a2a;background:#0d0d0d}
#top.on{display:flex}
.pill{flex:1;display:flex;align-items:center;gap:10px;background:#161616;border:1px solid #2a2a2a;border-radius:999px;padding:0 14px;height:42px}
.pill input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.pill .i{color:#8a8a8a;width:18px;height:18px}
#bar{position:absolute;top:0;left:0;height:2px;background:#fff;width:0;z-index:5;transition:width .3s}
main{position:relative;flex:1;overflow:hidden;z-index:1}
#home{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 70px;gap:26px}
#home.h{display:none}
.logo{width:68px;height:68px;border:1.5px solid #f2f2f2;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative}
.logo:after{content:"";position:absolute;inset:7px;border-radius:13px;border:1px solid #8a8a8a;border-style:dashed;animation:sp 18s linear infinite}
.logo .i{width:30px;height:30px}
@keyframes sp{to{transform:rotate(360deg)}}
h1{margin:0;font-size:25px;font-weight:300;letter-spacing:.42em;text-transform:uppercase;text-align:center;padding-left:.42em}
h1 b{font-weight:700}
.sub{color:#8a8a8a;font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-top:-16px}
.sb{width:100%;position:relative}
.sb .pill{height:54px;background:rgba(18,18,18,.8);backdrop-filter:blur(8px);box-shadow:0 0 40px rgba(255,255,255,.04)}
.sb .pill:focus-within{border-color:#777;box-shadow:0 0 40px rgba(255,255,255,.1)}
.sg{position:absolute;left:0;right:0;top:60px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;z-index:4;display:none}
.sg.on{display:block}
.sg button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid #2a2a2a;font-size:14px}
.sg button:last-child{border:0}.sg .i{width:16px;height:16px;color:#8a8a8a}
.sc{display:flex;flex-wrap:wrap;width:100%}
.sc button{width:25%;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#8a8a8a;min-width:0}
.sc span.t{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.sc .ic{width:54px;height:54px;border-radius:18px;background:rgba(20,20,20,.85);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;color:#f2f2f2;font-weight:600;font-size:18px;text-transform:uppercase}
.sc button:active .ic{background:#222}
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a8a8a;border:1px solid #2a2a2a;padding:6px 12px;border-radius:99px}
body.inc .badge{display:flex}.badge .i{width:15px;height:15px}
#view{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;padding:16px;display:none;background:#050505}
#view.on{display:block}
.meta{color:#8a8a8a;font-size:12px;margin:2px 4px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid #2a2a2a;border-radius:99px;padding:8px 14px;font-size:13px;color:#8a8a8a}
.chip:active{background:#222;color:#f2f2f2}
.res{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid #2a2a2a}
.res .u{display:flex;gap:8px;align-items:center;color:#8a8a8a;font-size:12px;margin-bottom:6px}
.fav{width:20px;height:20px;border-radius:6px;background:#222;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#f2f2f2;text-transform:uppercase}
.res h3{margin:0 0 5px;font-size:17px;font-weight:500}.res p{margin:0;font-size:13px;color:#8a8a8a;line-height:1.45}
.pg{text-align:center;padding-top:60px}.pg .fav{width:84px;height:84px;border-radius:26px;font-size:34px;margin:0 auto 22px;border:1px solid #2a2a2a;background:#161616}
.pg h2{margin:0 0 8px;font-weight:500;font-size:20px}.pg .lk{color:#8a8a8a;font-size:13px;word-break:break-all;margin-bottom:28px;display:flex;gap:6px;justify-content:center;align-items:center}
.pg .lk .i{width:14px;height:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:16px;border:1px solid #2a2a2a;background:#161616;margin-bottom:10px;font-size:15px}
.btn.p{background:#f2f2f2;color:#000;border-color:#f2f2f2;font-weight:600}.btn:active{opacity:.7}
#nav{position:relative;z-index:3;display:flex;justify-content:space-around;align-items:center;padding:6px 6px;border-top:1px solid #2a2a2a;background:#0d0d0d}
#nav button{width:52px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#f2f2f2;position:relative}
#nav button:active{background:#222}#nav button[disabled]{opacity:.25}
#nav .cnt{font-size:11px;font-weight:700;border:1.6px solid currentColor;border-radius:7px;min-width:23px;height:23px;display:flex;align-items:center;justify-content:center}
#nav .on{color:#000;background:#f2f2f2}
.ov{position:absolute;top:0;right:0;bottom:0;left:0;z-index:10;background:#050505;display:none;flex-direction:column;animation:up .22s ease}
.ov.on{display:flex}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.oh{display:flex;align-items:center;gap:8px;padding:14px 14px;border-bottom:1px solid #2a2a2a}
.oh h2{flex:1;margin:0;font-size:17px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.oh button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}.oh button:active{background:#222}
.ob{flex:1;overflow-y:auto;padding:14px}
.seg{display:flex;background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:10px;font-size:13px;color:#8a8a8a;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button .i{width:16px;height:16px}.seg .a{background:#f2f2f2;color:#000;font-weight:600}
.grid{display:flex;flex-wrap:wrap}
.card{width:calc(50% - 6px);margin:0 3px 12px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;position:relative;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.card.a{border-color:#f2f2f2}
.card .ch{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;font-size:12px}
.card .ch span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .ch button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.card .ch .i{width:15px;height:15px}
.card .pv{height:110px;display:flex;align-items:center;justify-content:center;background:#161616;border-top:1px solid #2a2a2a;color:#8a8a8a;font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:8px}
.card .pv .fav{width:40px;height:40px;border-radius:12px;font-size:16px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #2a2a2a;width:100%;text-align:left}
.row>div{flex:1;min-width:0}.row b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:#8a8a8a;font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .i{color:#8a8a8a}
.sec{color:#8a8a8a;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:20px 4px 4px}
.sw{width:48px;height:28px;border-radius:99px;background:#222;border:1px solid #2a2a2a;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8a8a;transition:.2s}
.sw.on{background:#f2f2f2}.sw.on:after{left:23px;background:#000}
input[type=range]{width:130px;accent-color:#fff}
.emp{text-align:center;color:#8a8a8a;padding:60px 20px;font-size:14px}.emp .i{width:40px;height:40px;margin-bottom:12px}
.sheet{position:absolute;top:0;right:0;bottom:0;left:0;z-index:12;display:none;background:rgba(0,0,0,.6);align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{width:100%;background:#0d0d0d;border-top:1px solid #2a2a2a;border-radius:24px 24px 0 0;padding:10px 14px 16px;animation:up .2s ease}
.sheet .gr{width:40px;height:4px;background:#222;border-radius:9px;margin:4px auto 8px}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:#f2f2f2;color:#000;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Windows Phone / Internet Explorer layout fallbacks */
#home>*{margin-bottom:20px} #home>*:last-child{margin-bottom:0}
#top>.pill{margin-left:0} .pill>*+*{margin-left:8px}
.sb .pill>*+*{margin-left:10px}
.sc button{margin-bottom:12px}
.sc .ic{display:flex;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;justify-content:center}
.badge>*+*{margin-left:8px}
.res .u>*+*{margin-left:8px}
.pg .lk>*+*{margin-left:6px}
.btn>*+*{margin-left:10px}
.oh>*+*{margin-left:8px}
.seg button>*+*{margin-left:8px}
.row>*+*{margin-left:14px}
body.inc #app,body.inc #view{background:#000}
body.inc #top,body.inc #nav,body.inc .ov,body.inc .sheet>div{background:#0a0a0a}
body.inc .pill,body.inc .sc .ic,body.inc .card .pv,body.inc .btn,body.inc .seg{background:#121212}
body.inc .card,body.inc .row,body.inc .res,body.inc #top,body.inc #nav{border-color:#333}
body.inc .meta,body.inc .sub,body.inc .sc button{color:#777}

/* Keep touch targets comfortable on the 4-inch display */
button{ -ms-touch-action:manipulation; touch-action:manipulation }
</style>
</head>
