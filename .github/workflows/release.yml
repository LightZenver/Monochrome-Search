name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Релиз .appx в GitHub Releases
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Версия из тега
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          "version=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Сборка и упаковка
        env:
          MONO_SIGN_PFX_B64: ${{ secrets.MONO_SIGN_PFX_B64 }}
          MONO_SIGN_PASS: ${{ secrets.MONO_SIGN_PASS }}
          MONO_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release -Platform ARM -OutDir out

      - name: Публикация в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ./out/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
